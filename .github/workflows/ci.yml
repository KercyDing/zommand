name: CI

on:
  push:
    paths:
      - "src/**"
      - "examples/**"
      - "test/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "test/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Check formatting
        run: >-
          zig fmt --check
          build.zig build.zig.zon src
          examples/*/build.zig examples/*/build.zig.zon examples/*/cli.zon examples/*/src

      - name: Build examples
        run: |
          (cd examples/greeting && zig build -Doptimize=safe -Dstrip=true)
          (cd examples/downloader && zig build -Doptimize=safe -Dstrip=true)
          (cd examples/dispatcher && zig build -Doptimize=safe -Dstrip=true)

      - name: Check dispatcher command errors
        run: |
          set +e
          ./examples/dispatcher/zig-out/bin/dispatcher status >/tmp/status.out 2>/tmp/status.err
          code=$?
          set -e
          test "$code" -eq 1
          grep -q "is not implemented" /tmp/status.err

          set +e
          ./examples/dispatcher/zig-out/bin/dispatcher none >/tmp/none.out 2>/tmp/none.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "unrecognized command 'none'" /tmp/none.err

      - name: Test downloader
        run: (cd examples/downloader && zig build test)

      - name: Check no-argument behavior
        run: |
          set +e
          ./examples/greeting/zig-out/bin/greeting >/tmp/greeting.out 2>/tmp/greeting.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "expected command argument" /tmp/greeting.err

          ./examples/greeting/zig-out/bin/greeting --help \
            >/tmp/greeting-help.out 2>/tmp/greeting-help.err
          grep -q "Usage: greeting" /tmp/greeting-help.out
